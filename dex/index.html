<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/awarizon-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizswap</title>
    <meta name="description" content="Swap tokens on the Awarizon blockchain" />
    <meta name="theme-color" content="#0D0D0F" />
    <link rel="canonical" href="https://dex.awarizon.com/" />

    <!-- Open Graph — dex.awarizon.com is the deployed link for the
         Rizswap brand until a standalone domain is set up; update
         both this and the canonical tag above when that happens. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rizswap" />
    <meta property="og:title" content="Rizswap — Swap on Awarizon" />
    <meta property="og:description" content="Swap tokens on the Awarizon blockchain" />
    <meta property="og:url" content="https://dex.awarizon.com/" />
    <meta property="og:image" content="https://dex.awarizon.com/awarizon-logo.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />

    <!-- Twitter/X card — square image only for now (see og:image note
         above), so summary rather than summary_large_image until a
         proper 1200x630 card exists. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rizswap — Swap on Awarizon" />
    <meta name="twitter:description" content="Swap tokens on the Awarizon blockchain" />
    <meta name="twitter:image" content="https://dex.awarizon.com/awarizon-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
