[workspace]

[package]
name = "awarizon-indexer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "awarizon-indexer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.103"
async-graphql = { version = "7.0.15", features = ["chrono", "dataloader"] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
hex = "0.4.3"
scale-value = { version = "0.18.2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "bigdecimal", "json", "migrate"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["chrono", "bigdecimal", "json", "migrate"] }
subxt = "0.41.0"
subxt-core = "0.41.0"
subxt-rpcs = { version = "0.41.0", features = ["jsonrpsee"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
