[package]
name = "pallet-awarizon-identity"
version = "0.1.0"
edition = "2021"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { version = "40.1.0", default-features = false }
frame-system = { version = "40.1.0", default-features = false }
sp-runtime = { version = "41.1.0", default-features = false }
pallet-awarizon-types = { path = "../awarizon-types", default-features = false }

[dev-dependencies]
sp-io = { version = "40.0.1", default-features = true }
sp-core = { version = "36.1.0", default-features = true }
sp-runtime = { version = "41.1.0", default-features = true }
pallet-balances = { version = "41.1.0", default-features = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "pallet-awarizon-types/std",
]
runtime-benchmarks = [
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
